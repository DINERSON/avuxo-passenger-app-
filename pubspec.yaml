name: avuxo_app
description: AVUXO Mobility App
publish_to: "none"
version: 1.0.5+6

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  pointer_interceptor: ^0.10.1+2
  cupertino_icons: ^1.0.8
  google_maps_flutter: ^2.17.0
  geolocator: ^14.0.2
  dio: ^5.6.0
  http: ^1.2.2
  flutter_polyline_points: ^2.1.0
  flutter_riverpod: ^2.5.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  firebase_storage: ^12.3.4
  image_picker: ^1.1.2
  pinput: ^5.0.0
  animate_do: ^3.3.4
  flutter_animate: ^4.5.0
  shared_preferences: ^2.3.2
  flutter_rating_bar: ^4.0.1
  intl: ^0.19.0
  url_launcher: ^6.3.1
  flutter_typeahead: ^6.0.0
  flutter_keyboard_visibility: ^6.0.0
  socket_io_client: ^3.1.4
  audioplayers: ^6.5.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

dependency_overrides:
  flutter_keyboard_visibility: 6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/avuxo_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/avuxo_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
